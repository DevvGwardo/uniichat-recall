name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Clone hermes-agent runtime modules
        run: git clone --depth 1 https://github.com/NousResearch/hermes-agent ../hermes-agent
      - name: Install test dependency
        run: python -m pip install ruamel.yaml
      - name: Run test suite
        env:
          PYTHONPATH: ${{ github.workspace }}/../hermes-agent
        run: python -m unittest discover -s tests
